<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoamPool – travel together, college to college</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--or:#F26A1B;--or2:#FF9A5C;--ink:#2B1B10;--mut:#8A7566;--soft:#FFF3EA;--line:#F4E1D3;--bg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,.logo{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select{font:inherit}
.btn{background:var(--or);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #f26a1b44}.btn.ghost{background:#fff;color:var(--or);border:1.5px solid var(--or)}.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
:focus-visible{outline:3px solid var(--or2);outline-offset:2px}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--or);outline:0;box-shadow:0 0 0 3px #f26a1b22}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
.hide{display:none!important}
/* auth */
#auth{position:relative;z-index:2;background:#fff;min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;transition:opacity .35s,transform .35s}
#auth.out{opacity:0;transform:scale(.985)}
.hero{background:linear-gradient(160deg,var(--or),#FF8A3D 70%,#FFB27D);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1.02;font-weight:800;max-width:520px}
.hero p{max-width:420px;opacity:.95;font-size:17px}
.hero svg{position:absolute;right:-40px;bottom:-10px;width:80%;opacity:.28}
.logo{font-weight:800;font-size:24px}.logo b{color:var(--or)}.hero .logo b{color:#fff;opacity:.85}
.panel{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:400px;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin:18px 0}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer;transition:.2s}
.tabs button.on{background:#fff;color:var(--or);box-shadow:0 2px 8px #f26a1b22}
.err{color:#C0361B;font-size:13px;min-height:18px;margin-top:8px}
.demo{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin-top:14px}
.adminlink{background:none;border:0;color:var(--mut);margin-top:16px;cursor:pointer;text-decoration:underline;font-size:13px}
/* app */
#app{animation:rise .5s both}
header{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:12px 24px;flex-wrap:wrap}
nav{display:flex;gap:4px;flex:1}nav button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--mut);cursor:pointer}
nav button.on{background:var(--soft);color:var(--or)}
.who{font-size:13px;color:var(--mut)}.who b{color:var(--ink)}
.tag{display:inline-block;background:var(--soft);color:var(--or);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:28px 24px 60px;position:relative;z-index:1}
.sub{color:var(--mut);margin:4px 0 22px}
/* season columns */
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}
.col h3{font-size:18px;padding:10px 14px;border-radius:12px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.col h3 small{font:500 12px Figtree;color:var(--mut)}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;margin-bottom:14px;box-shadow:0 4px 16px #2b1b1010}
.pic{height:140px;position:relative;overflow:hidden}.pic svg{width:100%;height:100%;display:block}
.off{position:absolute;top:10px;left:10px;background:var(--or);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.rec{position:absolute;top:10px;right:10px;background:#fff;color:var(--or);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.cb{padding:12px 14px}.cb h4{margin:0;font:800 17px 'Bricolage Grotesque',sans-serif}
.price{font-weight:800;font-size:19px;color:var(--or)}.price s{color:var(--mut);font-weight:400;font-size:13px;margin-left:6px}
.why{color:var(--mut);font-size:13px;margin:4px 0 8px}.pkg{font-size:12.5px;background:var(--soft);border-radius:9px;padding:7px 9px;margin-bottom:10px}
.row{display:flex;gap:8px}.row .btn{flex:1}
/* pools */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}.bar select{width:auto}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--mut)}.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.mem{display:flex;margin:8px 0}.av{width:30px;height:30px;border-radius:50%;background:var(--or2);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;border:2px solid #fff;margin-left:-8px}.av:first-child{margin-left:0}
.meta{font-size:13px;color:var(--mut)}.bar2{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin:6px 0 10px}.bar2 i{display:block;height:100%;background:var(--or)}
.form{background:var(--soft);border-radius:16px;padding:18px;margin-bottom:22px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px}
/* chat */
.chat{display:grid;grid-template-columns:240px 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;height:540px}
.rooms{background:var(--soft);overflow:auto;padding:10px}.rooms button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;font-weight:700}
.rooms button.on{background:#fff;color:var(--or)}.rooms small{display:block;font-weight:400;color:var(--mut)}
.cm{display:flex;flex-direction:column;min-height:0}.cm .top{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:75%;background:var(--soft);padding:8px 12px;border-radius:14px 14px 14px 4px;animation:rise .25s both}.m small{display:block;color:var(--or);font-weight:700;font-size:11.5px}
.m.me{align-self:flex-end;background:var(--or);color:#fff;border-radius:14px 14px 4px 14px}.m.me small{color:#ffe3d0}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.typing{font-size:12px;color:var(--mut);padding:0 16px 6px;min-height:20px}
/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}.stat{border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font:800 30px 'Bricolage Grotesque';color:var(--or);display:block}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:22px}
/* modal/toast */
.ov{position:fixed;inset:0;background:#2b1b1088;display:grid;place-items:center;z-index:20;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.md{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;animation:rise .3s both}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;transition:.3s;z-index:30}#toast.show{transform:translateX(-50%)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.k{position:absolute;opacity:.75}
.k1{width:380px;top:10%;left:-4%;animation:ksway 16s ease-in-out infinite alternate}
.k2{width:260px;top:30%;right:-3%;animation:ksway 12s ease-in-out -4s infinite alternate}
.k3{width:440px;top:55%;left:20%;animation:ksway 19s ease-in-out -8s infinite alternate;opacity:.55}
.k4{width:220px;top:72%;right:12%;animation:ksway 11s ease-in-out -2s infinite alternate}
.k5{width:300px;top:3%;left:48%;animation:ksway 14s ease-in-out -6s infinite alternate;opacity:.6}
@keyframes ksway{from{transform:translate(-40px,0)}to{transform:translate(70px,14px)}}
.bw{position:absolute;left:0;bottom:0;width:100%;height:70px}
.bw path{animation:flow2 14s linear infinite}
.cl.a{animation:swayc 7s ease-in-out infinite alternate}
.cl.b{animation:swayc 9s ease-in-out -3s infinite alternate}
@keyframes swayc{from{transform:translateX(-12px)}to{transform:translateX(16px)}}
.sw{animation:flow 5s linear infinite}
@keyframes flow{to{transform:translateX(-160px)}}
@keyframes flow2{to{transform:translateX(-300px)}}
.pic{overflow:hidden}.pic svg,.pic img{transform:scale(var(--z,1));transition:transform .12s linear}
.beach{height:240px;border-radius:20px;overflow:hidden;margin-bottom:24px;border:1px solid var(--line);box-shadow:0 8px 24px #f26a1b22}
.beach svg{width:100%;height:100%;display:block}
.beach .scn{transform:scale(calc(1 + var(--k,0)*.4));transform-origin:50% 100%}
.beach .sun{transform:translateY(calc(var(--k,0)*-46px))}
.beach .wv{animation:flow2 9s linear infinite}.beach .w2{animation-duration:6s;animation-direction:reverse}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
@keyframes rgbmove{to{background-position:200% 0}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
:root{--rgb:#ff2d2d,#ff9a00,#ffe600,#14c45a,#00c8ff,#2d7bff,#a64dff,#ff2d2d}
.card{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(var(--line),var(--line)) border-box}
.card:hover{background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--a),var(--rgb)) border-box;animation:spin 3s linear infinite;box-shadow:0 0 22px #a64dff44,0 0 34px #00c8ff33}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--rgb));background-size:200% 100%;animation:rgbmove 4s linear infinite}
header .logo b{background:linear-gradient(90deg,var(--rgb));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rgbmove 5s linear infinite}
.btn:hover{box-shadow:0 0 0 2px #fff,0 0 14px #ff2d2d88,0 0 26px #2d7bff77}
.btn.rgbb{background:linear-gradient(#F26A1B,#F26A1B) padding-box,conic-gradient(from var(--a),var(--rgb)) border-box;border:2px solid transparent;animation:spin 3s linear infinite}
.btn.s-r,.off.s-r,.tagst.s-r{background:#FF2D2D;box-shadow:0 0 12px #ff2d2d88}
.btn.s-g,.off.s-g,.tagst.s-g{background:#14C45A;box-shadow:0 0 12px #14c45a88}
.btn.s-b,.off.s-b,.tagst.s-b{background:#2D7BFF;box-shadow:0 0 12px #2d7bff88}
.tagst{display:inline-block;color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:20px;margin-top:6px}
.tagst.s-b{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 22px #2d7bffcc}}
@media(max-width:1000px){.cols{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){#auth{grid-template-columns:1fr}.hero{padding:28px;min-height:230px}.hero p{display:none}.cols{grid-template-columns:1fr}.chat{grid-template-columns:1fr;height:620px}.rooms{display:flex;overflow-x:auto;padding:6px}.rooms button{width:auto;white-space:nowrap}header{padding:10px 14px}main{padding:20px 14px 50px}}
/* v2: opening splash, RGB + per-section looks */
@keyframes splash{0%,70%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-6deg)}}
@keyframes cardin{from{opacity:0;transform:translateY(28px) scale(.94) rotateX(12deg)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
@keyframes gshift{50%{background-position:100% 50%}}
@keyframes drop{from{transform:translateY(-100%);opacity:0}}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:linear-gradient(160deg,#F26A1B,#FF8A3D 70%,#FFB27D);animation:splash 2.2s ease forwards;pointer-events:none}
#splash .logo{font-size:60px;color:#fff;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
#splash .logo b,header .logo b{background:linear-gradient(90deg,var(--rgb));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:1;animation:rgbmove 2s linear infinite}
#splash i{position:absolute;bottom:38%;left:50%;margin-left:-90px;width:180px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--rgb));background-size:200% 100%;animation:rgbmove 1.2s linear infinite}
.hero::before{content:'';position:absolute;width:440px;height:440px;left:-140px;top:-140px;border-radius:50%;background:conic-gradient(from var(--a),var(--rgb));filter:blur(70px);opacity:.35;animation:spin 8s linear infinite}
.hero>*{position:relative}.hero .logo{animation:rise .8s .3s both}.hero h1{animation:rise .8s .5s both}.hero p{animation:rise .8s .7s both}
.box>*{animation:rise .6s both}.box>*:nth-child(2){animation-delay:.1s}.box>*:nth-child(3){animation-delay:.2s}.box>*:nth-child(n+4){animation-delay:.3s}
input:focus,select:focus{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--rgb)) border-box;background-size:auto,200% 100%;animation:rgbmove 3s linear infinite;box-shadow:0 0 14px #a64dff33}
#app header{animation:drop .6s .1s both}
nav button{transition:.2s}nav button:hover{background:var(--soft);color:var(--or)}
nav button.on{position:relative}nav button.on::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--rgb));background-size:200% 100%;animation:rgbmove 3s linear infinite}
main h2{background:linear-gradient(90deg,#2B1B10,#F26A1B,#a64dff,#2D7BFF,#2B1B10);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
.card{position:relative;animation:cardin .6s var(--d,0s) both;transition:translate .25s,box-shadow .25s}
.card:hover{animation:cardin .6s var(--d,0s) both,spin 3s linear infinite;translate:0 -5px}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(190px circle at var(--mx,50%) var(--my,50%),#ff2d2d18,#2d7bff18 45%,transparent 70%)}.card:hover::after{opacity:1}
.beach{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--a),var(--rgb)) border-box;animation:spin 6s linear infinite}
.c-Winter{--ac:#2D7BFF}.c-Summer{--ac:#F26A1B}.c-Monsoon{--ac:#14C45A}.c-Autumn{--ac:#D6451F}
.col h3{border-left:5px solid var(--ac);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 16%,#fff),#fff)}
.col .off{background:var(--ac)}.col .price{color:var(--ac)}.col .btn:not(.ghost){background:var(--ac)}.col .btn.ghost{color:var(--ac);border-color:var(--ac);background:#fff}
.bar2 i{background:linear-gradient(90deg,var(--rgb));background-size:200% 100%;animation:rgbmove 3s linear infinite}
.av{background:linear-gradient(135deg,var(--or),#a64dff);transition:transform .2s}.av:hover{transform:translateY(-3px) scale(1.15);z-index:1}
.chip{transition:.2s}.chip:hover{transform:translateY(-2px);border-color:var(--or)}.chip.on{background:linear-gradient(120deg,#F26A1B,#a64dff,#2D7BFF);background-size:200% 200%;animation:gshift 5s ease infinite;box-shadow:0 0 14px #a64dff55}
.form{border:2px solid transparent;background:linear-gradient(var(--soft),var(--soft)) padding-box,linear-gradient(90deg,var(--rgb)) border-box;background-size:auto,200% 100%;animation:rise .4s both,rgbmove 4s linear infinite}
.rooms button{transition:.2s}.rooms button:hover{background:#fff8}.rooms button.on{box-shadow:inset 3px 0 0 var(--or),0 0 14px #a64dff33}
.m.me{background:linear-gradient(120deg,#F26A1B,#a64dff,#2D7BFF);background-size:200% 200%;animation:rise .25s both,gshift 6s ease infinite}
.chat{box-shadow:0 8px 28px #a64dff1f}
.stat{position:relative;overflow:hidden}.stat::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--rgb));background-size:200% 100%;animation:rgbmove 3s linear infinite}
.stat{animation:cardin .6s both}.stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}.stat:nth-child(4){animation-delay:.24s}
tr{transition:background .2s}tbody tr:hover td,table tr:hover td{background:var(--soft)}
.md{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--a),var(--rgb)) border-box;animation:rise .3s both,spin 4s linear infinite}
#toast{box-shadow:0 0 0 2px #ffffff22,0 0 22px #a64dff88}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}

/* v3: beach & cloud palette, new sections, RoamBot */
:root{--or:#0A9DB5;--or2:#4FD1E0;--ink:#0B2A3C;--mut:#5E7C8D;--soft:#E6F7FA;--line:#CFEAF0;--co:#FF6B57}
body{background:linear-gradient(#CFF1FA 0,#EAF9FD 300px,#fff 800px,#FFF6DF) fixed}
#sky .k{color:#fff!important}.bw path{fill:#BDEFF6}
#bs stop:first-child{stop-color:#7FD4F5}#bs stop:nth-child(2){stop-color:#EAFAFF}
.hero,#splash{background:linear-gradient(160deg,#0A9DB5,#2BB8D6 55%,#8EE3EF)}
.off{background:var(--co)}.price{color:#E8503A}
.btn.rgbb{background:linear-gradient(var(--or),var(--or)) padding-box,conic-gradient(from var(--a),var(--rgb)) border-box}
.chip.on,.m.me{background-image:linear-gradient(120deg,#0A9DB5,#7C4DFF,#FF4D8D)}
main h2{background-image:linear-gradient(90deg,#0B2A3C,#0A9DB5,#7C4DFF,#FF6B57,#0B2A3C)}
textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;min-height:80px;font:inherit;color:var(--ink);resize:vertical}
textarea:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px #0a9db522}
nav{overflow-x:auto}nav button{white-space:nowrap}#who{cursor:pointer}
.bch{position:absolute;left:0;bottom:0;width:100%;height:220px}
.sunr{transform-origin:1040px 60px;animation:spinr 40s linear infinite}@keyframes spinr{to{transform:rotate(360deg)}}
.wv3{animation:flow2 10s linear infinite}.wv3.b{animation-duration:7s;animation-direction:reverse}
.sail{animation:sail 50s ease-in-out infinite alternate}@keyframes sail{from{transform:translateX(-500px)}to{transform:translateX(450px)}}
.boat{transform-box:fill-box;transform-origin:center;animation:bobr 4s ease-in-out infinite}@keyframes bobr{50%{transform:translateY(-6px) rotate(2deg)}}
.gl{fill:none;stroke:#2B4A5E;stroke-width:3;stroke-linecap:round;animation:fly 24s linear infinite}.gl.g2{animation-duration:32s;animation-delay:-12s}
@keyframes fly{from{transform:translateX(-200px)}to{transform:translateX(1500px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.wv2{height:34px;overflow:hidden;margin:-8px 0 14px;border-radius:12px}.wv2 svg{width:100%;height:100%;display:block}
.wv2 path{animation:flow2 9s linear infinite}.wv2 .b{animation-duration:6s;animation-direction:reverse}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pf{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}@media(max-width:860px){.pf{grid-template-columns:1fr}}
.pcard{border-radius:18px;padding:22px;text-align:center;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--a),var(--rgb)) border-box;animation:rise .5s both,spin 6s linear infinite}
.bigav{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font:800 40px 'Bricolage Grotesque';color:#fff;background:linear-gradient(135deg,var(--or),#7C4DFF);box-shadow:0 0 0 4px #fff,0 0 22px #7c4dff66}
.pcard .stats{margin:14px 0 0}
